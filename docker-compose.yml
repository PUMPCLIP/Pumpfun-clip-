services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pumpclip
      POSTGRES_USER: pumpclip
      POSTGRES_PASSWORD: pumpclip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pumpclip"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
